name: Leer secretos de Vault

on:
  workflow_dispatch:

jobs:
  probar-vault:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar secretos desde Vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secret/data/online-boutique/dockerhub username | DOCKERHUB_USERNAME ;
            secret/data/online-boutique/dockerhub token | DOCKERHUB_TOKEN

      - name: Verificar sin imprimir el token
        shell: bash
        run: |
          echo "Usuario de Docker Hub: $DOCKERHUB_USERNAME"
          echo "El token mide ${#DOCKERHUB_TOKEN} caracteres"

      - name: Probar autenticación de Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
